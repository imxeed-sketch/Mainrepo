<body class="min-h-screen flex flex-col justify-between items-center relative selection:bg-matrix-green selection:text-black">

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);
        const alphabet = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%-+*';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let rainDrops = Array(columns).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(3, 7, 5, 0.08)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        let audioCtx = null, isAudioPlaying = false, ambientOsc = null, ambientGain = null;
        function toggleAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const audioIcon = document.getElementById('audioIcon'), audioText = document.getElementById('audioText');
            if (!isAudioPlaying) {
                audioCtx.resume();
                ambientOsc = audioCtx.createOscillator(); ambientGain = audioCtx.createGain();
                ambientOsc.type = 'sine'; ambientOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
                ambientGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                ambientGain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 3);
                ambientOsc.connect(ambientGain); ambientGain.connect(audioCtx.destination);
                ambientOsc.start(); isAudioPlaying = true;
                audioIcon.className = "fas fa-volume-up text-matrix-green"; audioText.innerText = "SOUND: ON";
            } else {
                if (ambientGain) { ambientGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1); setTimeout(() => { if (ambientOsc) ambientOsc.stop(); }, 1000); }
                isAudioPlaying = false; audioIcon.className = "fas fa-volume-mute"; audioText.innerText = "SOUND: OFF";
            }
        }
    </script>
